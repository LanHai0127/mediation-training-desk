<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#315c72" />
<meta name="format-detection" content="telephone=no" />
<title>调解台 · 基层矛盾纠纷调解训练</title>
<link rel="icon" href="data:," />
<!-- 口令门：真实浏览器先过 gate.html；无头验收与 ?gate=off 直接放行（见 ui/gate-guard.js） -->
  <!-- 口令门已开：真实浏览器先过 gate.html；无头验收与 ?gate=off 直接放行（见 ui/gate-guard.js） -->
  <script src="./ui/gate-guard.js"></script>
<style>
  :root {
    --ink: #355364; --cream: #fff3d7; --white: #fffaf0; --navy: #315c72;
    --coral: #e98578; --yellow: #ffd781; --dark: #294858;
    /* 刘海屏 / 底部横条：所有贴边元素都按这几个值让位（机型没有安全区时是 0px） */
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #0f1418; }
  /* iOS 上 100vh 含地址栏，用 dvh 后画布和 fixed 层才是"真的可见高度" */
  @supports (height: 100dvh) { #frame, #stage, #boot, #phoneMount { height: 100dvh; } }
  #stage { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #stage canvas { display: block; width: 100%; height: 100%; pointer-events: auto; touch-action: none; }
  #frame { position: fixed; inset: 0; border: 0; width: 100%; height: 100%; z-index: 5; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #frame.on { opacity: 1; pointer-events: auto; }
  #boot { position: fixed; inset: 0; z-index: 20; }
  #hint {
    position: fixed; left: 50%; bottom: calc(46px + var(--sab)); transform: translateX(-50%);
    font: 13px/1.6 system-ui, "Microsoft YaHei", sans-serif; color: var(--cream);
    opacity: 0; transition: opacity .4s ease; pointer-events: none; letter-spacing: .04em;
    max-width: calc(100vw - 32px); text-align: center;
  }
  #hint.on { opacity: .82; }
  /* 竖屏手机上的「建议横屏」轻提示：不挡操作、可关闭、记一次就不再烦 */
  #rotateTip {
    position: fixed; left: 50%; bottom: calc(84px + var(--sab)); transform: translate(-50%, 8px);
    z-index: 29; width: min(92vw, 360px); display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 14px; border-radius: 14px;
    background: rgba(41, 72, 88, .93); color: var(--cream);
    border: 1px solid rgba(255, 243, 215, .32);
    box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .6);
    font: 13px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    opacity: 0; transition: opacity .24s ease, transform .24s ease; pointer-events: none;
  }
  #rotateTip.on { opacity: 1; transform: translate(-50%, 0); }
  #rotateTip[hidden] { display: none; }
  #rotateTip span { flex: 1; min-width: 0; }
  #rotateTip button {
    flex: none; min-width: 44px; min-height: 44px; padding: 0 12px;
    pointer-events: auto;
    border-radius: 10px; border: 1px solid var(--cream); background: transparent;
    color: var(--cream); font: 13px/1 inherit; cursor: pointer;
  }
  #rotateTip button:active { background: var(--cream); color: var(--ink); }
  #phoneMount { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  /* 首屏只有「开始调解」一块板：右上角手机图标点过板之后才出现。
     .is-booting 挂在 #phoneMount 上，进场景（finishBoardExit / enterScene）时摘掉。 */
  #phoneMount.is-booting .tp-launch { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 注意：别在这里给 #phoneMount 的子元素统一开 pointer-events —— 手机根节点是铺满全屏的
     容器（.tp-root 自己写的是 none），用 id 选择器盖成 auto 会把 3D 画布和看板的点击全吞掉。
     开/关、机身、遮罩各自在 phone.js 里按状态开 pointer-events。 */
  /* 预热十场用的隐藏 iframe：挪到视口外，别用 display:none（WebGL 尺寸会变 0） */
  #preloadFrame {
    position: fixed; left: -12000px; top: 0; width: 1024px; height: 768px;
    border: 0; opacity: 0; pointer-events: none;
  }

  /* ---------------------------------------------------------------- 遮罩层通用 */
  .ovl {
    position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
    padding: calc(20px + var(--sat)) calc(20px + var(--sar)) calc(20px + var(--sab)) calc(20px + var(--sal));
    background: rgba(41, 72, 88, .62);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink); opacity: 0; transition: opacity .24s ease; pointer-events: none;
  }
  .ovl.on { opacity: 1; pointer-events: auto; }
  .ovl[hidden] { display: none; }

  /* ---------------------------------------------------------------- 加载页 */
  /* 背景不是色板，而是"云已经盖满"的那一层 —— 与地图传送用的是同一朵云
     （flight.js 的 paintClouds）。云是奶油白，底下垫 PAL 的深墨蓝当"天"，
     不然奶油云铺在奶油底上等于看不见；深墨蓝本身就是这套色板里的四色之一。 */
  #load { background: var(--navy); overflow: hidden; }
  #loadCloud {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  .load-card {
    position: relative; z-index: 1;
    width: min(100%, 460px); display: flex; flex-direction: column; gap: 12px;
    padding: 18px 20px 16px; border-radius: 18px;
    background: rgba(255, 250, 240, .82);
    border: 1.5px solid var(--navy);
    box-shadow: 0 26px 52px -26px rgba(41, 72, 88, .55), inset 0 1px 0 var(--white);
    backdrop-filter: blur(2px);
  }
  .load-kicker { font-size: 10px; letter-spacing: .5em; color: var(--navy); opacity: .75; }
  .load-cur {
    font: 600 20px/1.3 "Songti SC", "Noto Serif SC", "SimSun", serif;
    letter-spacing: .08em; color: var(--ink); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .load-bar {
    position: relative; height: 8px; border-radius: 5px; overflow: hidden;
    background: rgba(49, 92, 114, .18);
  }
  .load-bar > i {
    position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 5px;
    background: var(--coral); transition: width .3s cubic-bezier(.2, .8, .3, 1);
  }
  .load-meta {
    display: flex; align-items: baseline; gap: 10px;
    font-size: 11.5px; letter-spacing: .08em; color: var(--navy);
    font-variant-numeric: tabular-nums;
  }
  .load-meta #loadPct { margin-left: auto; font-size: 22px; font-weight: 700; color: var(--coral); }
  .load-dots { display: flex; gap: 6px; flex-wrap: wrap; }
  .load-dots b {
    width: 8px; height: 8px; border-radius: 50%; display: block;
    background: rgba(49, 92, 114, .22); transition: background .25s ease, transform .25s ease;
  }
  .load-dots b.ok { background: var(--navy); transform: scale(1.15); }
  .load-dots b.cur { background: var(--coral); }
  .load-tip { margin: 0; font-size: 11px; line-height: 1.7; color: var(--navy); opacity: .7; }

  /* ---------------------------------------------------------------- 评价 / 复盘层 */
  #reviewLayer {
    position: fixed; inset: 0; z-index: 74; display: none; place-items: center;
    padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
    background: rgba(41, 72, 88, .42);
  }
  #reviewLayer.on { display: grid; }
  #reviewLayer .rv-host { width: min(100%, 360px); min-width: 0; height: auto; }
  #replayLayer {
    position: fixed; inset: 0; z-index: 76; display: none; place-items: center;
    padding: calc(18px + var(--sat)) calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));
    background: rgba(41, 72, 88, .46);
  }
  #replayLayer.on { display: grid; }
  #replayHost { width: min(100%, 1120px); min-width: 0; max-width: 100%;
                max-height: calc(100vh - var(--sat) - var(--sab) - 36px);
                max-height: calc(100dvh - var(--sat) - var(--sab) - 36px); }
  #replayLayer .rp-host--flat {
    background: var(--white); border: 1.5px solid var(--ink); border-radius: 14px;
    padding: 14px 14px 12px; box-shadow: 0 20px 44px -22px rgba(41, 72, 88, .6);
  }
  .ovl-close {
    position: absolute; bottom: calc(18px + var(--sab)); right: calc(18px + var(--sar));
    min-width: 44px; min-height: 44px; padding: 0 15px; border-radius: 999px;
    border: 1.5px solid var(--cream); background: transparent; color: var(--cream);
    font: 13px/1 system-ui, "Microsoft YaHei", sans-serif; letter-spacing: .12em;
    cursor: pointer; transition: background .16s ease, color .16s ease;
  }
  .ovl-close:hover, .ovl-close:focus-visible { background: var(--cream); color: var(--ink); outline: none; }

  /* ---------------------------------------------------------------- 手机 / 横屏 */
  /* 竖屏窄屏：字和可点区域按手机的真实尺寸给，不再沿用桌面预览的 9~11px */
  @media (max-width: 600px) {
    .load-card { gap: 10px; padding: 16px 16px 14px; }
    .load-kicker { font-size: 13px; letter-spacing: .32em; }
    .load-cur { font-size: 19px; }
    .load-meta { font-size: 13px; }
    .load-meta #loadPct { font-size: 22px; }
    .load-tip { font-size: 13px; }
    .load-dots b { width: 9px; height: 9px; }
    #hint { font-size: 13px; bottom: calc(58px + var(--sab)); }
  }
  /* 横屏：3D 吃满整屏，浮层与页脚让位；UI 只在右边缘留一个 44px 的开机键 */
  @media (orientation: landscape) and (max-height: 560px) {
    #hint { bottom: calc(10px + var(--sab)); font-size: 12px; opacity: 0; }
    #hint.on { opacity: .7; }
    #beian { display: none !important; }
    #rotateTip { display: none !important; }
    .ovl { padding: calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal)); }
    .load-card { width: min(100%, 400px); padding: 12px 14px 11px; gap: 8px; }
    .load-kicker { display: none; }
    .load-cur { font-size: 17px; }
    .ovl-close { bottom: calc(8px + var(--sab)); right: calc(8px + var(--sar)); }
    #reviewLayer, #replayLayer { align-items: stretch; }
    #reviewLayer .rv-host, #replayHost { width: 100%; }
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="boot"></div>
  <iframe id="frame" title="场景" allow="fullscreen"></iframe>
  <div id="hint"></div>
  <div id="rotateTip" hidden>
    <span>横屏看场景更清楚，走位和转视角都更宽裕</span>
    <button type="button" id="rotateTipClose" aria-label="关闭横屏建议">知道了</button>
  </div>
  <div id="phoneMount" class="is-booting"></div>

  <!-- 加载页：云已经盖满，十场场景在云后面逐个预热，全绿才进游戏 -->
  <div id="load" class="ovl" hidden aria-label="正在准备">
    <canvas id="loadCloud" aria-hidden="true"></canvas>
    <div class="load-card">
      <div class="load-kicker">正在准备训练场</div>
      <div class="load-cur" id="loadCur">正在准备…</div>
      <div class="load-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"
           aria-valuenow="0" id="loadBar"><i id="loadFill"></i></div>
      <div class="load-meta">
        <span id="loadCount">0 / 10</span>
        <span id="loadState">准备中</span>
        <span id="loadPct">0%</span>
      </div>
      <div class="load-dots" id="loadDots"></div>
    </div>
  </div>

  <div id="reviewLayer"><!-- review.js 挂这里 --></div>
  <div id="replayLayer">
    <div id="replayHost"><!-- replay.js 挂这里 --></div>
    <button class="ovl-close" id="replayClose" type="button">收起复盘</button>
  </div>

  <div id="beian" style="position:fixed;left:50%;bottom:calc(8px + var(--sab));transform:translateX(-50%);font:13px/1.5 system-ui,'Microsoft YaHei',sans-serif;color:#fff3d7;opacity:.55;pointer-events:auto;z-index:60;white-space:nowrap">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">ICP备2026019740号</a>
  </div>
  <script type="module" src="./ui/app.js"></script>
</body>
</html>
