<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#294858" />
<meta name="format-detection" content="telephone=no" />
<meta name="robots" content="noindex" />
<title>口令 · 调解台</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/static/gate.css" />
</head>
<body>

<div class="gate-badge">教学演练 · 虚构案例 · 非真实警情</div>
<div class="gate-ver">演示版 · 口令进入</div>

<main class="gate">
  <section class="gate-card" aria-labelledby="gateTitle">
    <p class="gate-kicker">基层矛盾纠纷调解模拟训练系统</p>
    <h1 class="gate-title" id="gateTitle">调解台</h1>
    <p class="gate-sub">输入口令，进入今天的调解现场</p>

    <form id="gateForm" novalidate autocomplete="off">
      <label class="gate-label" for="gatePw">口令</label>
      <input
        id="gatePw" class="gate-pw" name="password" type="password"
        inputmode="numeric" pattern="[0-9]*" maxlength="12"
        autocomplete="current-password" placeholder="······"
        aria-describedby="gateErr" required />
      <button id="gateGo" class="gate-go" type="submit">进入训练台</button>
      <p id="gateErr" class="gate-err" role="alert" aria-live="polite"></p>
    </form>

    <p class="gate-foot">Demo 尚在内测中</p>
  </section>
</main>

<canvas id="gateCloud" aria-hidden="true"></canvas>

<script type="module" src="/static/gate.js"></script>
</body>
</html>
