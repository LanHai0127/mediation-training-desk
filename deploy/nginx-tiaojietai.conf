# 独立 conf：只追加，不改动服务器上已有站点
server {
    listen 443 ssl http2;
    server_name tiaojietai.example.com;

    ssl_certificate     /etc/letsencrypt/live/tiaojietai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiaojietai.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
